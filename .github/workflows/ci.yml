name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore Homies.sln

      - name: Build solution
        run: dotnet build Homies.sln --no-restore

      - name: Run all tests
        run: dotnet test Homies.sln --no-build